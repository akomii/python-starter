[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "python-starter"
version = "0.0.0"
description = "{{DESCRIPTION}}"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "{{AUTHOR}}" }]
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.17.0",
  "mypy>=2.4.0",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "lefthook>=2.2.1",
  "git-cliff>=2.14.2",
]

[tool.ruff]
line-length = 150
indent-width = 2
target-version = "py312"

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term --cov-report=html"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
